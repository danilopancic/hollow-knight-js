<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow Knight</title>

    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/register.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="favicon" href="assets/landing/logo_main.png" />

    <!-- Script -->
    <script src="js/system/auth.js" type="module" defer></script>

    <!-- Jquery -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"
      integrity="sha512-aVKKRRi/Q/YV+4mjoKBsE4x3H+BkegoM/em46NNlCqNTmUYADjBbeNefNxYV7giUp0VxICtqdrbqU7iVaeZNXA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <div class="auth-container">
      <div class="login-background"></div>
      <div class="black"></div>

      <!-- Login Form -->
      <div class="login-form-container">
        <div class="login-form">
          <!-- Register Button -->
          <div class="register-button cursor-pointer">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12.75 15l3-3m0 0l-3-3m3 3h-7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </div>
          <div class="inside-form">
            <h1 class="title hollow">Sign In</h1>
            <input
              id="loginEmail"
              class="input-form"
              type="text"
              placeholder="Email"
            />
            <input
              id="loginPassword"
              class="input-form"
              type="password"
              placeholder="Password"
            />
            <button id="loginButton">Login</button>
            <p class="auth-toggle-text">
              Don't have an account?
              <a href="javascript:void(0)" class="auth-toggle-link register-toggle-link">Register</a>
            </p>
            <p id="loginAuthMessage" class="auth-message"></p>
            <a class="back-to-home" href="./index.html"
              >Want to Back to home ?</a
            >
          </div>
          <div class="login-black"></div>
        </div>

        <div class="register-form">
          <!-- Login Button -->
          <div class="login-button cursor-pointer">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12.75 15l3-3m0 0l-3-3m3 3h-7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </div>
          <div class="inside-form">
            <h1 class="title hollow">Sign Up</h1>
            <input
              id="registerEmail"
              class="input-form"
              type="text"
              placeholder="Email"
            />
            <input
              id="registerFirstName"
              class="input-form"
              type="text"
              placeholder="First Name"
            />
            <input
              id="registerLastName"
              class="input-form"
              type="text"
              placeholder="Last Name"
            />
            <select
              id="registerLocation"
              class="input-form"
              type="text"
              placeholder="Location"
            >
              <option value="Afghanistan">Afghanistan</option>
              <option value="Albania">Albania</option>
              <option value="Argentina">Argentina</option>
              <option value="Australia">Australia</option>
              <option value="Austria">Austria</option>
              <option value="Belgium">Belgium</option>
              <option value="Brazil">Brazil</option>
              <option value="Canada">Canada</option>
              <option value="China">China</option>
              <option value="Croatia">Croatia</option>
              <option value="Czech Republic">Czech Republic</option>
              <option value="Denmark">Denmark</option>
              <option value="Finland">Finland</option>
              <option value="France">France</option>
              <option value="Germany">Germany</option>
              <option value="Greece">Greece</option>
              <option value="Hungary">Hungary</option>
              <option value="India">India</option>
              <option value="Indonesia">Indonesia</option>
              <option value="Ireland">Ireland</option>
              <option value="Italy">Italy</option>
              <option value="Japan">Japan</option>
              <option value="Malaysia">Malaysia</option>
              <option value="Mexico">Mexico</option>
              <option value="Netherlands">Netherlands</option>
              <option value="New Zealand">New Zealand</option>
              <option value="Norway">Norway</option>
              <option value="Pakistan">Pakistan</option>
              <option value="Philippines">Philippines</option>
              <option value="Poland">Poland</option>
              <option value="Portugal">Portugal</option>
              <option value="Romania">Romania</option>
              <option value="Russia">Russia</option>
              <option value="Saudi Arabia">Saudi Arabia</option>
              <option value="Serbia">Serbia</option>
              <option value="Singapore">Singapore</option>
              <option value="South Africa">South Africa</option>
              <option value="South Korea">South Korea</option>
              <option value="Spain">Spain</option>
              <option value="Sweden">Sweden</option>
              <option value="Switzerland">Switzerland</option>
              <option value="Thailand">Thailand</option>
              <option value="Turkey">Turkey</option>
              <option value="Ukraine">Ukraine</option>
              <option value="United Arab Emirates">United Arab Emirates</option>
              <option value="United Kingdom">United Kingdom</option>
              <option value="United States">United States</option>
              <option value="Vietnam">Vietnam</option>
            </select>
            <input
              id="registerUsername"
              class="input-form"
              type="text"
              placeholder="Username"
            />
            <input
              id="registerPassword"
              class="input-form"
              type="password"
              placeholder="Password"
            />
            <button id="registerButton">Register</button>
            <p class="auth-toggle-text">
              Already have an account?
              <a href="javascript:void(0)" class="auth-toggle-link login-toggle-link">Login</a>
            </p>
            <p id="registerAuthMessage" class="auth-message"></p>
            <a class="back-to-home" href="./index.html"
              >Want to Back to home ?</a
            >
          </div>
          <div class="register-black"></div>
        </div>
      </div>
    </div>
  </body>
</html>
